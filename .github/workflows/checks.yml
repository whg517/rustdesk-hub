name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Style and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal web/embed.go)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on these files\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Lint and build the web app
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web lint
          pnpm -C web build
      - name: Check and test Go packages
        run: |
          go vet ./...
          go test -race -count=1 ./...
